<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; }
    .card .value { font-size: 1.8rem; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; gap: .5rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid #eaeef2; }
    li.done span.title { text-decoration: line-through; color: #6e7781; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input[type=text] { flex: 1; padding: .4rem; }
    .priority { font-size: .75rem; padding: .1rem .5rem; border-radius: 999px; border: 1px solid #d0d7de; text-transform: capitalize; }
    .priority-high { background: #ffebe9; border-color: #ff8182; }
    .priority-medium { background: #fff8c5; border-color: #d4a72c; }
    .priority-low { background: #ddf4ff; border-color: #54aeff; }
    li span.title { flex: 1; }
  </style>
</head>
<body>
  <h1>Task Dashboard</h1>
  <section class="cards" id="summary">
    <div class="card"><div>Total</div><div class="value" id="total">0</div></div>
    <div class="card"><div>Open</div><div class="value" id="open">0</div></div>
    <div class="card"><div>Done</div><div class="value" id="done">0</div></div>
    <div class="card"><div>High priority</div><div class="value" id="prio-high">0</div></div>
    <div class="card"><div>Medium priority</div><div class="value" id="prio-medium">0</div></div>
    <div class="card"><div>Low priority</div><div class="value" id="prio-low">0</div></div>
  </section>
  <form id="new-task">
    <input type="text" id="title" placeholder="New task" maxlength="200" required>
    <select id="priority" aria-label="Priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button type="submit">Add</button>
  </form>
  <ul id="tasks"></ul>
  <script>
    const api = (path, opts = {}) => fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts })
      .then((r) => (r.status === 204 ? null : r.json()));

    async function render() {
      const [tasks, stats] = await Promise.all([api('/api/tasks'), api('/api/stats')]);
      document.getElementById('total').textContent = stats.total;
      document.getElementById('open').textContent = stats.open;
      document.getElementById('done').textContent = stats.done;
      for (const p of ['high', 'medium', 'low']) {
        document.getElementById(`prio-${p}`).textContent = stats.byPriority[p];
      }
      const list = document.getElementById('tasks');
      list.replaceChildren(...tasks.map((t) => {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = t.done;
        box.onchange = () => api(`/api/tasks/${t.id}`, { method: 'PATCH', body: JSON.stringify({ done: box.checked }) }).then(render);
        const label = document.createElement('span');
        label.className = 'title';
        label.textContent = t.title;
        const prio = document.createElement('span');
        prio.className = `priority priority-${t.priority}`;
        prio.textContent = t.priority;
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.onclick = () => api(`/api/tasks/${t.id}`, { method: 'DELETE' }).then(render);
        li.append(box, label, prio, del);
        return li;
      }));
    }

    document.getElementById('new-task').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('title');
      const priority = document.getElementById('priority');
      await api('/api/tasks', { method: 'POST', body: JSON.stringify({ title: input.value, priority: priority.value }) });
      input.value = '';
      priority.value = 'medium';
      render();
    };
    render();
  </script>
</body>
</html>
